<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>معلومات المنشأة — Marhaba PMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#0027B7', soft: '#EEF2FF' }, secondary: '#079DD8' },
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../assets/css/app.css?v=setup2" />
</head>
<body class="app-bg font-sans" data-page="setup-property-info" data-title="معلومات المنشأة"
  data-crumbs='[{"label":"PMS","href":"dashboard.html"},{"label":"التهيئة","href":"setup.html"},{"label":"معلومات المنشأة"}]'>
  <div class="min-h-screen lg:flex">
    <aside id="app-sidebar"></aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header id="app-header"></header>
      <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-5">
        <div class="page-hero">
          <div>
            <p class="page-kicker">الشركة</p>
            <p class="text-slate-800 font-extrabold mt-1 text-lg">البيانات التجارية وتفاصيل المنشأة</p>
          </div>
          <button type="button" class="btn btn-primary" data-action="toast" data-message="تم حفظ الإعدادات (تجريبي)">حفظ الإعدادات</button>
        </div>
        <section class="panel p-5 space-y-4">
          <div>
            <h2 class="font-extrabold text-lg">التفاصيل التجارية</h2>
            <p class="text-sm text-slate-500">أرقام التسجيل والترخيص والضريبة</p>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="field-label">رقم السجل التجاري *</label><input class="field-input" type="text" value="1234567890" placeholder="" /></div>
            <div><label class="field-label">رقم رخصة النشاط</label><input class="field-input" type="text" value="LIC-99881" placeholder="" /></div>
            <div><label class="field-label">الرقم الضريبي</label><input class="field-input" type="text" value="3100000000" placeholder="" /></div>
            <div><label class="field-label">ملف السجل التجاري</label><input class="field-input" type="text" value="" placeholder="ارفع الملف…" /></div>
          </div>
        </section>

        <section class="panel p-5 space-y-4">
          <div>
            <h2 class="font-extrabold text-lg">تفاصيل المنشأة</h2>
            
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="field-label">تصنيف المنشأة</label><select class="field-select"><option >غير مصنّف</option><option >نجمة</option><option >نجمتان</option><option selected>ثلاث نجوم</option><option >أربع نجوم</option><option >خمس نجوم</option></select></div>
            <div><label class="field-label">وصف المنشأة</label><textarea class="field-input" rows="4">منشأة فندقية حديثة في قلب المدينة.</textarea></div>
            <div><label class="field-label">الهاتف</label><input class="field-input" type="text" value="+963 31 000000" placeholder="" /></div>
            <div><label class="field-label">البريد الإلكتروني</label><input class="field-input" type="text" value="info@property.sy" placeholder="" /></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  
  <script src="../assets/js/pms-data.js"></script>
  <script src="../assets/js/app.js?v=setup2"></script>
  <script src="../assets/js/setup-pages.js?v=setup1"></script>
  <script>
    /* settings form — mutations simulated via toasts */
  </script>
</body>
</html>
