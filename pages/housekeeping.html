  <style>
    .hk-page { --vacant:#55A06F; --occupied:#C44755; --waiting:#7B4FC8; --checkout:#C9A227; --dirty:#B08900; --clean-gold:#C9A227; }
    .hk-topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem; }
    .hk-view-label { font-size:.75rem; font-weight:800; color:#94a3b8; margin-inline-end:.35rem; }
    .hk-filter-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem; }
    .hk-toolbar {
      display:flex; flex-wrap:wrap; align-items:center; gap:.75rem;
      background:#fff; border:1px solid #E8ECF1; border-radius:14px; padding:.75rem 1rem;
    }
    .hk-toolbar .hk-search {
      flex:1 1 200px; min-width:160px; max-width:360px;
    }
    .hk-toolbar .hk-pills { flex:1 1 auto; justify-content:flex-end; }
    .hk-pager {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
      gap:.75rem; padding-top:.25rem;
    }
    .hk-pager .hk-range { font-size:.875rem; font-weight:700; color:#64748B; }
    .hk-pills { display:flex; flex-wrap:wrap; gap:.45rem; }
    .hk-pill {
      display:inline-flex; align-items:center; gap:.4rem;
      border:1px solid #E2E8F0; background:#fff; color:#64748B;
      border-radius:999px; padding:.42rem .85rem; font:700 .8rem/1.2 Cairo,sans-serif;
      cursor:pointer; transition:.15s;
    }
    .hk-pill:hover { border-color:#cbd5e1; color:#0f172a; }
    .hk-pill.is-on { background:#0027B7; border-color:#0027B7; color:#fff; }
    .hk-pill.is-on[data-f="vacant"] { background:var(--vacant); border-color:var(--vacant); }
    .hk-pill.is-on[data-f="occupied"] { background:var(--occupied); border-color:var(--occupied); }
    .hk-pill.is-on[data-f="waiting"] { background:var(--waiting); border-color:var(--waiting); }
    .hk-pill.is-on[data-f="checkout"] { background:var(--checkout); border-color:var(--checkout); }
    .hk-pill.is-on[data-f="dirty"], .hk-pill.is-on[data-f="rented-dirty"] { background:var(--dirty); border-color:var(--dirty); }
    .hk-pill.is-on[data-f="clean"] { background:var(--clean-gold); border-color:var(--clean-gold); }
    .hk-pill .n {
      min-width:1.2rem; height:1.2rem; padding:0 .3rem; border-radius:999px;
      background:#F1F5F9; color:#0f172a; font-size:.68rem; font-weight:800;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .hk-pill.is-on .n { background:rgba(255,255,255,.22); color:#fff; }
    .hk-ico { width:14px; height:14px; flex-shrink:0; }

    .room-grid {
      display:grid; gap:12px; align-items:stretch;
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
    @media(min-width:640px){ .room-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media(min-width:900px){ .room-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media(min-width:1100px){ .room-grid{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
    @media(min-width:1400px){ .room-grid{ grid-template-columns:repeat(7,minmax(0,1fr)); } }

    .room-card {
      display:flex; flex-direction:column;
      height:188px;
      background:#fff; border:1px solid #E8ECF1; border-radius:12px;
      overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,.04);
      text-align:start; font-family:Cairo,sans-serif; cursor:pointer; padding:0;
      transition:transform .15s, box-shadow .15s;
    }
    .room-card:hover { transform:translateY(-2px); box-shadow:0 10px 22px rgba(15,23,42,.08); }
    .room-card.hide { display:none !important; }
    .room-card.dirty-bg { background:linear-gradient(180deg,#FFF6DE 0%,#fff 42%); }

    .rc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:14px 14px 6px; }
    .rc-num { font-size:22px; font-weight:800; color:#0f172a; line-height:1; letter-spacing:-.02em; }
    .rc-type { margin-top:4px; font-size:11px; font-weight:700; color:#94A3B8; }

    /* Property + mop badge (reference style) */
    .rc-prop {
      position: relative;
      width: 34px;
      height: 40px;
      flex-shrink: 0;
      --prop: #C9A227;
      --prop-win: #FFF8E7;
      --mop: #D9C79A;
      color: var(--prop);
    }
    .rc-prop > .rc-building,
    .rc-prop > svg:first-of-type {
      width: 28px;
      height: 36px;
      display: block;
      color: var(--prop);
    }
    .rc-mop {
      position: absolute;
      inset-inline-end: -4px;
      bottom: -2px;
      width: 20px;
      height: 28px;
      color: var(--mop) !important;
      transform: rotate(-28deg);
      transform-origin: 50% 10%;
      filter: drop-shadow(0 0 1px rgba(0,0,0,.08));
      pointer-events: none;
    }
    .room-card[data-status="vacant"] .rc-prop { --prop: var(--vacant); --prop-win: #EAF6EE; --mop: #C9B27A; }
    .room-card[data-status="occupied"] .rc-prop { --prop: var(--occupied); --prop-win: #FCECEE; --mop: #D9C79A; }
    .room-card[data-status="waiting"] .rc-prop { --prop: var(--waiting); --prop-win: #F3ECFB; --mop: #D9C79A; }
    .room-card[data-status="checkout"] .rc-prop { --prop: var(--checkout); --prop-win: #FFF8E7; --mop: #E8D9B0; }
    .room-card[data-hk="dirty"] .rc-prop,
    .room-card[data-hk="rented-dirty"] .rc-prop {
      --prop: #C9A227;
      --prop-win: #FFF8E7;
      --mop: #E6D7B0;
    }

    .rc-mid {
      flex:1; display:flex; flex-direction:column; justify-content:center;
      padding:4px 14px 12px; min-height:0; gap:2px;
    }
    .rc-ready { color:var(--vacant); font-size:13px; font-weight:700; }
    .rc-guest { color:#0f172a; font-size:14px; font-weight:800; }
    .rc-bal { color:var(--occupied); font-size:12px; font-weight:800; }
    .rc-wait { color:var(--waiting); font-size:12px; font-weight:700; }
    .rc-dirty { color:#8A6A00; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px; }
    .rc-out { display:inline-flex; align-items:center; gap:6px; background:#F1F5F9; color:#475569;
      border-radius:999px; padding:4px 8px; font-size:11px; font-weight:700; width:fit-content; }

    .rc-foot {
      margin-top:auto; display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px; color:#fff; font-size:12px; font-weight:800; min-height:40px;
    }
    .rc-foot-l { display:inline-flex; align-items:center; gap:6px; }
    .rc-foot svg { width:14px; height:14px; }
    .room-card[data-status="vacant"] .rc-foot { background:var(--vacant); }
    .room-card[data-status="occupied"] .rc-foot { background:var(--occupied); }
    .room-card[data-status="waiting"] .rc-foot { background:var(--waiting); }
    .room-card[data-status="checkout"] .rc-foot { background:var(--checkout); }
    .room-card[data-status="vacant"][data-hk="dirty"] .rc-foot { background:var(--dirty); }

        .hk-empty { display:none; grid-column:1/-1; text-align:center; padding:48px 16px; color:#64748B; font-weight:700; }
    .hk-empty.show { display:block; }
  </style>

  <script>
    (function  {
      const grid = document.getElementById('room-grid');
      const cards =  => [...grid.querySelectorAll('.room-card')];
      const empty = document.getElementById('hk-empty');
      const range = document.getElementById('hk-range');
      const search = document.getElementById('hk-search');
      let statusF = 'all';
      let hkF = 'all-hk';

      function setCounts {
        const all = cards;
        const map = {
          all: all.length,
          vacant: all.filter(c => c.dataset.status === 'vacant').length,
          occupied: all.filter(c => c.dataset.status === 'occupied').length,
          waiting: all.filter(c => c.dataset.status === 'waiting').length,
          checkout: all.filter(c => c.dataset.status === 'checkout').length,
          clean: all.filter(c => c.dataset.hk === 'clean').length,
          dirty: all.filter(c => c.dataset.hk === 'dirty').length,
          'rented-dirty': all.filter(c => c.dataset.hk === 'rented-dirty').length,
        };
        Object.keys(map).forEach(k => {
          document.querySelectorAll('[data-c="' + k + '"]').forEach(el => { el.textContent = map[k]; });
        });
      }

      function match(card) {
        const q = (search.value || '').trim.toLowerCase;
        const hay = [card.dataset.room, card.dataset.type, card.dataset.guest, card.textContent].join(' ').toLowerCase;
        if (q && !hay.includes(q)) return false;
        if (statusF !== 'all' && card.dataset.status !== statusF) return false;
        if (hkF === 'clean' && card.dataset.hk !== 'clean') return false;
        if (hkF === 'dirty' && card.dataset.hk !== 'dirty') return false;
        if (hkF === 'rented-dirty' && card.dataset.hk !== 'rented-dirty') return false;
        return true;
      }

      function apply {
        let n = 0;
        cards.forEach(card => {
          const ok = match(card);
          card.classList.toggle('hide', !ok);
          if (ok) n += 1;
        });
        empty.classList.toggle('show', n === 0);
        range.textContent = n ? ('1–' + n + ' من ' + n) : '0 من 0';
      }

      function bindPills(rootId, group) {
        document.getElementById(rootId).addEventListener('click', (e) => {
          const btn = e.target.closest('.hk-pill');
          if (!btn) return;
          document.querySelectorAll('#' + rootId + ' .hk-pill').forEach(b => b.classList.remove('is-on'));
          btn.classList.add('is-on');
          if (group === 'status') statusF = btn.dataset.f;
          else hkF = btn.dataset.f;
          apply;
        });
      }
      bindPills('status-pills', 'status');
      bindPills('hk-pills', 'hk');
      search.addEventListener('input', apply);

      grid.addEventListener('click', (e) => {
        const card = e.target.closest('.room-card');
        if (card) document.getElementById('room-num').textContent = card.dataset.room;
      });

      setCounts;
      apply;
    });
  </script>
