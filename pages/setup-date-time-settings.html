<body class="app-bg font-sans" data-page="setup-date-time-settings" data-title="إعدادات التاريخ والوقت"
  data-crumbs='[{"label":"PMS","href":"dashboard.html"},{"label":"التهيئة","href":"setup.html"},{"label":"إعدادات التاريخ والوقت"}]'>
  <div class="min-h-screen lg:flex">
    <aside id="app-sidebar"></aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header id="app-header"></header>
      <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-5">
        <div class="page-hero">
          <div>
            <p class="page-kicker">إعدادات عامة</p>
            <p class="text-slate-800 font-extrabold mt-1 text-lg">المنطقة الزمنية وأوقات الدخول والخروج</p>
          </div>
          <button type="button" class="btn btn-primary" data-action="toast" data-message="تم حفظ الإعدادات (تجريبي)">حفظ الإعدادات</button>
        </div>
        <section class="panel p-5 space-y-4">
          <div>
            <h2 class="font-extrabold text-lg">التوقيت</h2>
            
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="field-label">المنطقة الزمنية</label><select class="field-select"><option selected>Asia/Damascus</option><option >Asia/Riyadh</option><option >UTC</option></select></div>
            <div><label class="field-label">تنسيق التاريخ</label><select class="field-select"><option selected>يوم/شهر/سنة</option><option >سنة-شهر-يوم</option></select></div>
            <div><label class="field-label">وقت تسجيل الدخول</label><input class="field-input" type="time" value="14:00" placeholder="" /></div>
            <div><label class="field-label">وقت المغادرة</label><input class="field-input" type="time" value="12:00" placeholder="" /></div>
          </div>
        </section>
      </main>
    </div>
  </div>
