<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الفئات — Marhaba PMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#0027B7', soft: '#EEF2FF' }, secondary: '#079DD8' },
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../assets/css/app.css?v=fin3" />
</head>
<body class="app-bg font-sans" data-page="finance-categories" data-title="الفئات"
  data-crumbs='[{"label":"PMS","href":"dashboard.html"},{"label":"المالية","href":"finance-transactions.html"},{"label":"الفئات"}]'>
  <div class="min-h-screen lg:flex">
    <aside id="app-sidebar"></aside>
    <div class="flex-1 min-w-0 flex flex-col">
      <header id="app-header"></header>
      <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-5" id="page-root">
        <div class="page-hero">
          <div>
            <p class="page-kicker">الإيرادات والمصروفات</p>
            <p class="text-slate-800 font-extrabold mt-1 text-lg">فئات الإيرادات والمصروفات</p>
          </div>
          <button type="button" class="btn btn-primary" id="add-category-btn">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            إضافة فئة
          </button>
        </div>

        <nav class="fin-subnav" aria-label="أقسام المالية">
          <a class="chip" href="finance-transactions.html">الحركات المالية</a>
          <a class="chip" href="finance-cashboxes.html">الصناديق</a>
          <a class="chip" href="finance-rates.html">أسعار الصرف</a>
          <a class="chip is-active" href="finance-categories.html">الفئات</a>
        </nav>

        <div class="grid lg:grid-cols-2 gap-4">
          <section class="panel overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <h3 class="font-extrabold">فئات الإيرادات</h3>
            </div>
            <ul class="divide-y divide-slate-100" id="cat-income-list"></ul>
          </section>
          <section class="panel overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
              <h3 class="font-extrabold">فئات المصروفات</h3>
            </div>
            <ul class="divide-y divide-slate-100" id="cat-expense-list"></ul>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="category-modal" class="modal">
    <div class="p-5 border-b border-slate-200 flex justify-between items-center">
      <h3 class="font-extrabold" id="cat-modal-title">إضافة فئة</h3>
      <button class="icon-btn" title="إغلاق" aria-label="إغلاق" data-action="close-modal" data-target="category-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="p-5 space-y-4">
      <div><label class="field-label">اسم الفئة *</label><input id="c-name" class="field-input" placeholder="مثال: Room Revenue" /></div>
      <div>
        <label class="field-label">النوع *</label>
        <select id="c-type" class="field-select"><option value="income">إيراد</option><option value="expense">مصروف</option></select>
      </div>
      <div><label class="field-label">الرمز المحاسبي</label><input id="c-code" class="field-input" placeholder="مثال: 4000" /></div>
      <div>
        <label class="field-label">المنشآت المتاحة لها</label>
        <div class="space-y-2" id="c-properties"></div>
      </div>
    </div>
    <div class="p-5 border-t border-slate-200 flex justify-end gap-2">
      <button class="btn btn-ghost" data-action="close-modal" data-target="category-modal">إلغاء</button>
      <button class="btn btn-primary" id="c-save-btn">حفظ الفئة</button>
    </div>
  </div>

  <script src="../assets/js/pms-data.js"></script>
  <script src="../assets/js/finance-data.js"></script>
  <script src="../assets/js/app.js?v=fin3"></script>
  <script src="../assets/js/finance-transactions.js?v=fin3"></script>
</body>
</html>
